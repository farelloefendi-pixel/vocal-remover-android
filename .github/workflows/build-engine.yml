name: Build CSR native engine

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/**"
      - "main.lua"
      - ".github/workflows/build-engine.yml"

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Fetch ONNX Runtime Android AAR
        run: |
          mkdir -p build-ort
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.32.0/onnxruntime-android-1.32.0.aar \
            --output build-ort/onnxruntime-android.aar
          mkdir -p build-ort/unpacked
          unzip -q build-ort/onnxruntime-android.aar -d build-ort/unpacked
          test -s build-ort/unpacked/classes.jar
          test -s build-ort/unpacked/jni/arm64-v8a/libonnxruntime.so
          cp build-ort/unpacked/jni/arm64-v8a/libonnxruntime.so dist-libonnxruntime.so
          sha256sum build-ort/onnxruntime-android.aar dist-libonnxruntime.so

      - name: Fetch pinned Demucs C++ engine
        run: |
          git clone https://github.com/jPaauwe/demucs-android.git third_party/demucs-android
          git -C third_party/demucs-android checkout f4bc42b6c209beea2aa4a04d37c75cd06b0c90d2
          git -C third_party/demucs-android submodule update --init --recursive

      - name: Build JNI engine for ARM64
        run: |
          cmake -S third_party/demucs-android -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDENGINE_TOOLS=OFF \
            -DSDENGINE_JNI=ON \
            -DSDENGINE_JNI_CLASS=DJLEngine \
            -DEIGEN_DIR="$GITHUB_WORKSPACE/third_party/demucs-android/third_party/eigen"
          cmake --build build-arm64 --config Release --parallel 2
          mkdir -p dist
          find build-arm64 -name 'libsdengine_jni.so' -print -quit | xargs -r -I{} cp "{}" dist/libdjl64.so
          test -s dist/libdjl64.so

      - name: Compile Java bridge into DEX
        run: |
          mkdir -p build-java/classes dist
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar:build-ort/unpacked/classes.jar" \
            -d build-java/classes bridge/java/DJLEngine.java
          javap -classpath build-java/classes -s -p DJLEngine > dist/JNI_SIGNATURES.txt
          javap -classpath build-java/classes -s -p 'DJLEngine$ProgressListener' >> dist/JNI_SIGNATURES.txt
          grep -Fq 'descriptor: (Ljava/lang/String;IILjava/lang/String;LDJLEngine$ProgressListener;)Ljava/lang/String;' dist/JNI_SIGNATURES.txt
          grep -Fq 'descriptor: (Ljava/lang/String;Ljava/lang/String;[ZIIZLDJLEngine$ProgressListener;)[D' dist/JNI_SIGNATURES.txt
          grep -Fq 'descriptor: (FLjava/lang/String;)Z' dist/JNI_SIGNATURES.txt
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output dist build-java/classes/DJLEngine*.class build-ort/unpacked/classes.jar
          test -s dist/classes.dex
          mv dist/classes.dex dist/DJLEngine.dex
          "$ANDROID_HOME/build-tools/35.0.0/dexdump" -l plain dist/DJLEngine.dex > dist/DEX_CLASSES.txt
          grep -Fq "Lai/onnxruntime/OrtEnvironment;" dist/DEX_CLASSES.txt

      - name: Check Lua bridge syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p bridge/lua/DJLBridge.lua
          luac5.4 -p main.lua

      - name: Verify outputs
        run: |
          mkdir -p dist/bridge/lua dist/licenses
          cp main.lua dist/main.lua
          cp dist-libonnxruntime.so dist/libonnxruntime.so
          cp bridge/lua/DJLBridge.lua dist/bridge/lua/DJLBridge.lua
          cp licenses/* dist/licenses/
          file dist/libdjl64.so dist/libonnxruntime.so dist/DJLEngine.dex
          readelf -h dist/libdjl64.so | grep -E 'Class:|Machine:'
          readelf -h dist/libonnxruntime.so | grep -E 'Class:|Machine:' | grep -q AArch64
          readelf -l dist/libdjl64.so | tee dist/ELF_PROGRAM_HEADERS.txt
          readelf -l dist/libonnxruntime.so | tee dist/ORT_ELF_PROGRAM_HEADERS.txt
          grep -q '0x4000' dist/ELF_PROGRAM_HEADERS.txt
          grep -q '0x4000' dist/ORT_ELF_PROGRAM_HEADERS.txt
          sha256sum dist/libdjl64.so dist/libonnxruntime.so dist/DJLEngine.dex | tee dist/SHA256SUMS.txt
          (cd dist && zip -q -r Vocal_Remover_CSR_DEV.ppk main.lua DJLEngine.dex libdjl64.so libonnxruntime.so bridge/lua/DJLBridge.lua licenses)
          unzip -l dist/Vocal_Remover_CSR_DEV.ppk
          cat > dist/BUILD_INFO.txt <<'EOF'
          Product: CSR/Jieshuo Vocal Remover native bridge
          ABI: arm64-v8a
          Android minimum API: 29
          NDK: 27.2.12479018
          JNI class: DJLEngine
          ONNX Runtime Android: 1.32.0 (MIT, ARM64)
          Model: disabled pending clarification of HTDemucs 6-stem weight rights
          Package status: development prototype, not a functional release
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vocal-remover-csr-dev-arm64
          path: dist/*
          if-no-files-found: error
