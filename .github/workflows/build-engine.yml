name: Build Kim Vocal 2 CSR extension

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/**"
      - "main.lua"
      - ".github/workflows/build-engine.yml"

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Fetch ONNX Runtime Android AAR
        run: |
          mkdir -p build-ort
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.31.1/onnxruntime-android-1.31.1.aar \
            --output build-ort/onnxruntime-android.aar
          mkdir -p build-ort/unpacked
          unzip -q build-ort/onnxruntime-android.aar -d build-ort/unpacked
          test -s build-ort/unpacked/classes.jar
          test -s build-ort/unpacked/jni/arm64-v8a/libonnxruntime.so
          test -s build-ort/unpacked/jni/arm64-v8a/libonnxruntime4j_jni.so
          mkdir -p dist
          cp build-ort/unpacked/jni/arm64-v8a/libonnxruntime.so dist/libonnxruntime.so
          cp build-ort/unpacked/jni/arm64-v8a/libonnxruntime4j_jni.so dist/libonnxruntime4j_jni.so

      - name: Fetch pinned Android audio preparation helper
        run: |
          git clone https://github.com/jPaauwe/demucs-android.git third_party/audio-helper
          git -C third_party/audio-helper checkout f4bc42b6c209beea2aa4a04d37c75cd06b0c90d2
          git -C third_party/audio-helper submodule update --init --recursive

      - name: Build ARM64 audio preparation JNI
        run: |
          cmake -S third_party/audio-helper -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDENGINE_TOOLS=OFF \
            -DSDENGINE_JNI=ON \
            -DSDENGINE_JNI_CLASS=DJLEngine \
            -DEIGEN_DIR="$GITHUB_WORKSPACE/third_party/audio-helper/third_party/eigen"
          cmake --build build-arm64 --config Release --parallel 2
          find build-arm64 -name 'libsdengine_jni.so' -print -quit | xargs -r -I{} cp "{}" dist/libdjl64.so
          test -s dist/libdjl64.so

      - name: Compile Java DSP and ONNX bridge into DEX
        run: |
          mkdir -p build-java/classes
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar:build-ort/unpacked/classes.jar" \
            -d build-java/classes bridge/java/MDXNetDSP.java bridge/java/DJLEngine.java
          javap -classpath build-java/classes -s -p DJLEngine > dist/JNI_SIGNATURES.txt
          javap -classpath build-java/classes -s -p 'DJLEngine$ProgressListener' >> dist/JNI_SIGNATURES.txt
          grep -Fq 'descriptor: (Ljava/lang/String;IILjava/lang/String;LDJLEngine$ProgressListener;)Ljava/lang/String;' dist/JNI_SIGNATURES.txt
          grep -Fq 'descriptor: ()V' dist/JNI_SIGNATURES.txt
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output dist \
            build-java/classes/*.class build-ort/unpacked/classes.jar
          test -s dist/classes.dex
          mv dist/classes.dex dist/DJLEngine.dex
          "$ANDROID_HOME/build-tools/35.0.0/dexdump" -l plain dist/DJLEngine.dex > dist/DEX_CLASSES.txt
          grep -Fq "Lai/onnxruntime/OrtEnvironment;" dist/DEX_CLASSES.txt
          grep -Fq "LMDXNetDSP;" dist/DEX_CLASSES.txt

      - name: Validate Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p bridge/lua/DJLBridge.lua
          luac5.4 -p main.lua

      - name: Assemble CSR extension package
        run: |
          mkdir -p dist/bridge/lua dist/licenses
          cp main.lua dist/main.lua
          cp bridge/lua/DJLBridge.lua dist/bridge/lua/DJLBridge.lua
          cp licenses/* dist/licenses/
          file dist/libdjl64.so dist/libonnxruntime.so dist/libonnxruntime4j_jni.so dist/DJLEngine.dex
          readelf -h dist/libdjl64.so | grep -E 'Class:|Machine:' | grep -q AArch64
          readelf -h dist/libonnxruntime.so | grep -E 'Class:|Machine:' | grep -q AArch64
          readelf -h dist/libonnxruntime4j_jni.so | grep -E 'Class:|Machine:' | grep -q AArch64
          sha256sum dist/libdjl64.so dist/libonnxruntime.so dist/libonnxruntime4j_jni.so dist/DJLEngine.dex | tee dist/SHA256SUMS.txt
          git rev-parse HEAD | tee dist/SOURCE_COMMIT.txt
          sha256sum main.lua bridge/lua/DJLBridge.lua bridge/java/DJLEngine.java | tee dist/SOURCE_SHA256SUMS.txt
          cat > dist/BUILD_INFO.txt <<'EOF'
          Product: Jieshuo/CSR Vocal Remover
          ABI: arm64-v8a
          Android minimum API: 29
          ONNX Runtime Android: 1.31.1
          Model: Kim Vocal 2 MDX-Net, original ONNX
          Model file: Kim_Vocal_2.onnx
          Model SHA-256: ce74ef3b6a6024ce44211a07be9cf8bc6d87728cc852a68ab34eb8e58cde9c8b
          Outputs: vocals.wav, instrumental.wav
          DSP: Java Bluestein FFT, MDX STFT/iSTFT, 25-percent Hann weighted overlap-add
          Status: integration candidate; device audio-quality and accessibility tests still required
          EOF
          echo "Source commit: $(git rev-parse HEAD)" >> dist/BUILD_INFO.txt
          rm -f dist/Vocal_Remover_Kim_Vocal_2_CSR_TEST.ppk
          (cd dist && zip -q -r Vocal_Remover_Kim_Vocal_2_CSR_TEST.ppk main.lua DJLEngine.dex libdjl64.so libonnxruntime.so libonnxruntime4j_jni.so bridge/lua/DJLBridge.lua licenses BUILD_INFO.txt SHA256SUMS.txt SOURCE_COMMIT.txt SOURCE_SHA256SUMS.txt)
          test "$(unzip -p dist/Vocal_Remover_Kim_Vocal_2_CSR_TEST.ppk main.lua | sha256sum | cut -d' ' -f1)" = "$(sha256sum main.lua | cut -d' ' -f1)"
          test "$(unzip -p dist/Vocal_Remover_Kim_Vocal_2_CSR_TEST.ppk bridge/lua/DJLBridge.lua | sha256sum | cut -d' ' -f1)" = "$(sha256sum bridge/lua/DJLBridge.lua | cut -d' ' -f1)"
          unzip -t dist/Vocal_Remover_Kim_Vocal_2_CSR_TEST.ppk
          unzip -l dist/Vocal_Remover_Kim_Vocal_2_CSR_TEST.ppk

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: Vocal_Remover_Kim_Vocal_2_CSR_TEST
          path: dist/Vocal_Remover_Kim_Vocal_2_CSR_TEST.ppk
          if-no-files-found: error
