name: Build CSR native engine

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/**"
      - ".github/workflows/build-engine.yml"
      - "docs/MESIN_DEMUCS.md"

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Fetch pinned Demucs C++ engine
        run: |
          git clone https://github.com/jPaauwe/demucs-android.git third_party/demucs-android
          git -C third_party/demucs-android checkout f4bc42b6c209beea2aa4a04d37c75cd06b0c90d2
          git -C third_party/demucs-android submodule update --init --recursive

      - name: Build JNI engine for ARM64
        run: |
          cmake -S third_party/demucs-android -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDENGINE_TOOLS=OFF \
            -DSDENGINE_JNI=ON \
            -DSDENGINE_JNI_CLASS=DJLEngine \
            -DEIGEN_DIR="$GITHUB_WORKSPACE/third_party/demucs-android/third_party/eigen"
          cmake --build build-arm64 --config Release --parallel 2
          mkdir -p dist
          find build-arm64 -name 'libsdengine_jni.so' -print -quit | xargs -r -I{} cp "{}" dist/libdjl64.so
          test -s dist/libdjl64.so

      - name: Compile Java bridge into DEX
        run: |
          mkdir -p build-java/classes dist
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build-java/classes bridge/java/DJLEngine.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output dist build-java/classes/DJLEngine*.class
          test -s dist/classes.dex
          mv dist/classes.dex dist/DJLEngine.dex

      - name: Verify outputs
        run: |
          file dist/libdjl64.so dist/DJLEngine.dex
          readelf -h dist/libdjl64.so | grep -E 'Class:|Machine:'
          sha256sum dist/libdjl64.so dist/DJLEngine.dex | tee dist/SHA256SUMS.txt
          cat > dist/BUILD_INFO.txt <<'EOF'
          Product: CSR/Jieshuo Vocal Remover native bridge
          ABI: arm64-v8a
          Android minimum API: 29
          NDK: 27.2.12479018
          JNI class: DJLEngine
          Model file (separate download): 5c90dfd2.safetensors
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vocal-remover-csr-arm64
          path: dist/*
          if-no-files-found: error
