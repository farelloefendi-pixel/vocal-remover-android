name: Validate Kim Vocal 2 bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/java/DJLEngine.java"
      - "bridge/lua/DJLBridge.lua"
      - "bridge/test/**"
      - "main.lua"
      - ".github/workflows/validate-kim-contract.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch ONNX Runtime Android API
        run: |
          mkdir -p build/ort build/classes build/dex
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.31.1/onnxruntime-android-1.31.1.aar \
            --output build/ort/onnxruntime.aar
          unzip -q build/ort/onnxruntime.aar -d build/ort/unpacked
          test -s build/ort/unpacked/classes.jar

      - name: Validate pinned Kim Vocal 2 ONNX model
        run: |
          curl --fail --location --retry 3 \
            https://huggingface.co/aaatmy/uvr-mdx-net-onnx/resolve/main/Kim_Vocal_2.onnx \
            --output build/Kim_Vocal_2.onnx
          echo "ce74ef3b6a6024ce44211a07be9cf8bc6d87728cc852a68ab34eb8e58cde9c8b  build/Kim_Vocal_2.onnx" | sha256sum -c -
          python -m pip install --quiet numpy onnxruntime
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort
          path = "build/Kim_Vocal_2.onnx"
          session = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          assert [item.name for item in session.get_inputs()] == ["input"]
          assert [item.name for item in session.get_outputs()] == ["output"]
          expected = [1, 4, 3072, 256]
          input_shape = session.get_inputs()[0].shape
          output_shape = session.get_outputs()[0].shape
          assert input_shape[0] in (1, None, "batch_size"), input_shape
          assert output_shape[0] in (1, None, "batch_size"), output_shape
          assert input_shape[1:] == expected[1:], input_shape
          assert output_shape[1:] == expected[1:], output_shape
          n_fft, hop, chunk = 7680, 1024, 1024 * 255
          t = np.arange(chunk, dtype=np.float32) / 44100.0
          left = 0.20 * np.sin(2 * np.pi * 440 * t) + 0.05 * np.sin(2 * np.pi * 997 * t)
          right = 0.17 * np.cos(2 * np.pi * 311 * t)
          window = 0.5 - 0.5 * np.cos(2 * np.pi * np.arange(n_fft) / n_fft)
          def spectrum(channel):
              padded = np.pad(channel, (n_fft // 2, n_fft // 2), mode="reflect")
              frames = np.stack([padded[i * hop:i * hop + n_fft] for i in range(256)])
              return np.fft.rfft(frames * window[None, :], axis=1)
          left_spec = spectrum(left)
          right_spec = spectrum(right)
          tensor = np.stack([
              left_spec.real[:, :3072].T,
              left_spec.imag[:, :3072].T,
              right_spec.real[:, :3072].T,
              right_spec.imag[:, :3072].T,
          ], axis=0)[None].astype(np.float32)
          assert tensor.shape == tuple(expected), tensor.shape
          output = session.run(["output"], {"input": tensor})[0]
          assert output.shape == tuple(expected), output.shape
          assert np.isfinite(output).all()
          assert np.max(np.abs(output)) > 0
          print("Kim Vocal 2 ONNX non-zero audio inference OK:", output.shape)
          PY

      - name: Compile Java bridge
        run: |
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar:build/ort/unpacked/classes.jar" \
            -d build/classes bridge/java/MDXNetDSP.java bridge/java/DJLEngine.java
          mkdir -p build/test-classes
          javac -source 8 -target 8 -classpath build/classes -d build/test-classes bridge/test/MDXNetDSPTest.java
          java -cp build/classes:build/test-classes MDXNetDSPTest
          javap -classpath build/classes -p DJLEngine > build/DJLEngine.txt
          grep -Fq "ujiModelKimVocal2" build/DJLEngine.txt
          grep -Fq "Kim_Vocal_2.onnx" bridge/java/DJLEngine.java
          grep -Fq "ce74ef3b6a6024ce44211a07be9cf8bc6d87728cc852a68ab34eb8e58cde9c8b" bridge/java/DJLEngine.java
          grep -Fq 'new long[] { 1, 4, 3072, 256 }' bridge/java/DJLEngine.java
          grep -Fq "Model bukan Kim Vocal 2" bridge/java/DJLEngine.java
          grep -Fq "MDXNetDSP.createInput" bridge/java/DJLEngine.java
          grep -Fq "instrumental.wav" bridge/java/DJLEngine.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output build/dex \
            build/classes/*.class build/ort/unpacked/classes.jar
          test -s build/dex/classes.dex

      - name: Validate Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p bridge/lua/DJLBridge.lua
          luac5.4 -p main.lua
